<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rakuichi and buster</title>
<style>
@font-face {
  font-family: undertale;
  src: local("Determination Mono"),
       url("font/DTM-Mono.otf");
}
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: undertale, "Courier New", monospace;
}
canvas {
  display: block;
  margin: auto;
  width: min(100vw, 1200px);
  height: auto;
  image-rendering: pixelated;
  touch-action: none;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
"use strict";

// ==========================================
// config
// ==========================================
const BASE_W = 400;
const BASE_H = 200;
const SCALE = 3;
const SPR_W = 16;
const SPR_H = 30;

const ZW = 380;
const ZH = 380;
const HS = 40;
const PLEN = 720;

const canvas = document.getElementById("game");
canvas.width = BASE_W * SCALE;
canvas.height = BASE_H * SCALE;

const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const ZX = (canvas.width - ZW) / 2;
const ZY = (canvas.height - ZH) / 2;
const FONT = 'undertale, "Courier New", monospace';

// ==========================================
// foto's
// ==========================================
const ROOT = "/home/delta/Downloads/deltarune/";

function load(src) {
  const image = new Image();
  image.onload = () => console.log("GELUKT:", src,
    image.naturalWidth, image.naturalHeight);
  image.onerror = () => console.error("MISLUKT:", image.src);
  image.src = src;
  return image;
}

const kris = {
  down: [0,1,2,3].map(i => load(ROOT + "kris/down_" + i + ".png")),
  left: [0,1].map(i => load(ROOT + "kris/left_" + i + ".png")),
  right: [0,1].map(i => load(ROOT + "kris/right_" + i + ".png")),
  up: [0,1,2,3].map(i => load(ROOT + "kris/up_" + i + ".png"))
};

const ITEMS = [
  {id:"up",name:"bovenkant",x:188,y:14,col:"#4a90e2"},
  {id:"down",name:"onderkant",x:188,y:164,col:"#e2a64a"},
  {id:"left",name:"linkerkant",x:28,y:88,col:"#4ae27a"},
  {id:"right",name:"rechterkant",x:348,y:88,col:"#e24a8a"},
  {id:"back",name:"achterkant",x:290,y:36,col:"#9a4ae2"},
  {id:"front",name:"voorkant",x:86,y:140,col:"#e2e24a"}
].map(item => ({
  ...item,
  img: load(ROOT + "box/" + item.id + ".png"),
  pop: 0
}));

// hart
const heartImg = load(ROOT + "heart.png");
// vijand afbeelding. anders een debug sprite
const enemyImg = load(ROOT + "enemy.png");
const DIALOOG = {
  up:["* Doos 1."],
  down:["* Doos 2."],
  left:["* Doos 3."],
  right:["* Doos 4."],
  front:["* Doos 5."],
  back:["* Doos 6."],
  alles:["* Je hebt alles geïnspecteerd."]
};

const TYPSNELHEID = 0.6;

// ==========================================
// spelstatus
// ==========================================
const player = {
  x: BASE_W / 2 - SPR_W / 2,
  y: BASE_H / 2 - SPR_H / 2,
  speed: 2,
  dir: "down",
  frame: 0,
  timer: 0,
  moving: false
};

let mode = "world";
let tr = 0;
let fr = 0;
let bt = null;
let dlg = null;
let ptr = null;
let last = performance.now();
let acc = 0;

const seen = new Set();
const keys = {};
const K = (...names) => names.some(name => keys[name]);

// ==========================================
// knoppen
// ==========================================
addEventListener("keydown", event => {
  const key = event.key.toLowerCase();

  if (key.startsWith("arrow") || key === " ") {
    event.preventDefault();
  }

  if (!keys[key]) onPress(key);
  keys[key] = true;
});

addEventListener("keyup", event => {
  keys[event.key.toLowerCase()] = false;
});

addEventListener("blur", () => {
  for (const key in keys) keys[key] = false;
  ptr = null;
});

function pt(event) {
  const r = canvas.getBoundingClientRect();
  return {
    x: (event.clientX - r.left) * canvas.width / r.width,
    y: (event.clientY - r.top) * canvas.height / r.height
  };
}

canvas.addEventListener("pointerdown", event => {
  const p = pt(event);
  if (mode === "world" && clickWorld(p)) return;
  ptr = p;
});

canvas.addEventListener("pointermove", event => {
  if (ptr) ptr = pt(event);
});

addEventListener("pointerup", () => ptr = null);

function vec(cx, cy) {
  let dx = (K("arrowright","d") ? 1 : 0) -
           (K("arrowleft","q","a") ? 1 : 0);
  let dy = (K("arrowdown","s") ? 1 : 0) -
           (K("arrowup","z","w") ? 1 : 0);

  if (!dx && !dy && ptr) {
    const vx = ptr.x - cx;
    const vy = ptr.y - cy;
    const d = Math.hypot(vx, vy);
    if (d > 8) {
      dx = vx / d;
      dy = vy / d;
    }
  }
  return [dx,dy];
}

function toggle() {
  if (mode === "world") {
    mode = "trans";
    tr = 0;
    dlg = null;
  } else {
    mode = "world";
    ptr = null;
  }
}

function onPress(key) {
  if (key === "b" && mode !== "battle") toggle();

  if (mode === "world" &&
      (key === "e" || key === "enter" || key === " ")) {
    act();
  }

  if (mode !== "battle") return;

  if (key >= "1" && key <= "7") {
    bt.auto = false;
    setPat(Number(key) - 1);
  }
  if (key === "n") {
    bt.auto = false;
    setPat(bt.pat + 1);
  }
  if (key === "0") bt.auto = true;
}

// ==========================================
// dozen en hitboxen
// ==========================================
const IS = 24;

const feetBox = (x=player.x,y=player.y) => ({
  x:x+2, y:y+20, w:SPR_W-4, h:SPR_H-20
});

const itemBox = item => ({
  x:item.x, y:item.y, w:IS, h:IS
});

const overlap = (a,b,m=0) =>
  a.x < b.x+b.w+m &&
  a.x+a.w > b.x-m &&
  a.y < b.y+b.h+m &&
  a.y+a.h > b.y-m;

const blocked = (x,y) =>
  ITEMS.some(item => overlap(feetBox(x,y),itemBox(item)));

const reachable = item => overlap(feetBox(),itemBox(item),8);

function nearItem() {
  let best = null;
  let distance = Infinity;
  const f = feetBox();

  for (const item of ITEMS) {
    if (!reachable(item)) continue;

    const d = Math.hypot(
      item.x + IS/2 - (f.x+f.w/2),
      item.y + IS/2 - (f.y+f.h/2)
    );

    if (d < distance) {
      distance = d;
      best = item;
    }
  }
  return best;
}

function openItem(item) {
  item.pop = 30;
  ptr = null;

  const f = feetBox();
  const vx = item.x+IS/2-(f.x+f.w/2);
  const vy = item.y+IS/2-(f.y+f.h/2);

  player.dir = Math.abs(vx)>Math.abs(vy)
    ? (vx<0 ? "left":"right")
    : (vy<0 ? "up":"down");

  player.frame = 0;

  const lines = [...(DIALOOG[item.id] || ["* ..."])];
  seen.add(item.id);

  if (seen.size === ITEMS.length && !seen.has("alles")) {
    seen.add("alles");
    lines.push(...DIALOOG.alles);
  }

  dlg = {
    lines,
    i:0,
    c:0,
    top:player.y+SPR_H/2>BASE_H/2
  };
}

function act() {
  if (dlg) {
    const line = dlg.lines[dlg.i];

    if (dlg.c < line.length) {
      dlg.c = line.length;
    } else if (++dlg.i >= dlg.lines.length) {
      dlg = null;
    } else {
      dlg.c = 0;
    }
    return;
  }

  const item = nearItem();
  if (item) openItem(item);
}

function clickWorld(p) {
  if (dlg) {
    act();
    return true;
  }

  const x = p.x/SCALE;
  const y = p.y/SCALE;

  const item = ITEMS.find(i =>
    x>=i.x && x<=i.x+IS &&
    y>=i.y && y<=i.y+IS
  );

  if (item && reachable(item)) {
    openItem(item);
    return true;
  }
  return false;
}

// ==========================================
// vijand en gevecht
// ==========================================
const rnd = (a,b) => a+Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

const orb = (x,y,vx,vy,r=7) =>
  bt.bul.push({k:0,x,y,vx,vy,r});

const rect = (x,y,w,h,vx,vy) =>
  bt.bul.push({k:1,x,y,w,h,vx,vy});

const beam = (x,y,w,h) =>
  bt.bul.push({k:2,x,y,w,h,age:0});

const hcx = () => bt.hx+HS/2;
const hcy = () => bt.hy+HS/2;

function startBattle() {
  mode = "battle";
  bt = {
    hx:(ZW-HS)/2,
    hy:ZH*.65,
    hp:20,
    inv:0,
    dead:0,
    pat:0,
    t:0,
    pause:60,
    auto:true,
    bul:[],
    g:5
  };
}

function setPat(n) {
  bt.pat = (n+PAT.length)%PAT.length;
  bt.t = 0;
  bt.pause = 30;
  bt.bul = [];
}

const PAT = [
  {
    n:"rain",
    f:t=>{
      if(t%6===0) orb(rnd(10,ZW-10),-10,0,3+rnd(0,1.5)+t/360);
    }
  },
  {
    n:"pee",
    f:t=>{
      if(t%4===0) {
        const a=Math.PI/2+Math.sin(t*.045)*1.15;
        orb(ZW/2,0,Math.cos(a)*3,Math.sin(a)*3,6);
      }
      if(t>300&&t%8===0) {
        const a=-Math.PI/2+Math.sin(t*.05)*1.1;
        orb(ZW/2,ZH,Math.cos(a)*3,Math.sin(a)*3,6);
      }
    }
  },
  {
    n:"flappy bird",
    f:t=>{
      if(t%72===20) {
        const left=(Math.floor(t/72)%2===0);
        const gap=100;
        const gy=rnd(30,ZH-gap-30);
        const v=(left?1:-1)*(3.2+t/360);
        const x=left?-16:ZW;
        rect(x,0,16,gy,v,0);
        rect(x,gy+gap,16,ZH-gy-gap,v,0);
      }
    }
  },
  {
    n:"jevil",
    f:t=>{
      if(t%38===0) {
        const s=Math.random()*4|0;
        const sx=s===0?0:s===1?ZW:rnd(0,ZW);
        const sy=s===2?0:s===3?ZH:rnd(0,ZH);
        const a=Math.atan2(hcy()-sy,hcx()-sx);
        for(const d of [-.22,0,.22])
          orb(sx,sy,Math.cos(a+d)*3.4,Math.sin(a+d)*3.4,7);
      }
    }
  },
  {
    n:"thunder",
    f:t=>{
      if(t%105===15) {
        const horizontal=Math.random()<.5;
        const p=(horizontal?hcy():hcx())-18+rnd(-30,30);
        if(horizontal) beam(0,clamp(p,0,ZH-36),ZW,36);
        else beam(clamp(p,0,ZW-36),0,36,ZH);
      }
    }
  },
  {
    n:"reverse fall-guys hexagon reverse mode with gravity",
    f:t=>{
      if(t%52===0) {
        const cols=Math.floor(ZW/28);
        const x0=(ZW-cols*28)/2+14;
        bt.g=clamp(bt.g+Math.round(rnd(-4,4)),0,cols-4);
        for(let i=0;i<cols;i++)
          if(i<bt.g||i>=bt.g+4)
            orb(x0+i*28,-10,0,2.6,8);
      }
    }
  },
  {
    n:"jevil 360",
    f:t=>{
      if(t%58===0) {
        const x=rnd(80,ZW-80);
        const y=rnd(40,160);
        const o=Math.random()*6.28;
        for(let i=0;i<16;i++) {
          const a=o+i*Math.PI/8;
          orb(x,y,Math.cos(a)*2.2,Math.sin(a)*2.2,6);
        }
      }
    }
  }
];

function hit(b,cx,cy) {
  if(b.k===0) return Math.hypot(b.x-cx,b.y-cy)<b.r+9;
  if(b.k===2 && !(b.age>=40&&b.age<62)) return false;

  const nx=clamp(cx,b.x,b.x+b.w);
  const ny=clamp(cy,b.y,b.y+b.h);
  return Math.hypot(nx-cx,ny-cy)<9;
}

function updateBattle() {
  if(bt.dead>0) {
    if(--bt.dead===0) {
      bt.hp=20;
      bt.bul=[];
      bt.t=0;
      bt.pause=60;
      bt.hx=(ZW-HS)/2;
      bt.hy=ZH*.65;
      bt.inv=0;
    }
    return;
  }

  const [dx,dy]=vec(ZX+hcx(),ZY+hcy());
  bt.hx=clamp(bt.hx+dx*4.6,0,ZW-HS);
  bt.hy=clamp(bt.hy+dy*4.6,0,ZH-HS);

  if(bt.pause>0) {
    if(--bt.pause===0) bt.bul=[];
  } else {
    PAT[bt.pat].f(bt.t);

    if(++bt.t>=PLEN) {
      bt.t=0;
      bt.pause=80;
      if(bt.auto) bt.pat=(bt.pat+1)%PAT.length;
    }
  }

  if(bt.inv>0) bt.inv--;

  for(const b of bt.bul) {
    b.x+=b.vx||0;
    b.y+=b.vy||0;
    if(b.k===2) b.age++;

    if(bt.inv<=0&&hit(b,hcx(),hcy())) {
      bt.hp-=b.k===2?6:b.k===1?4:3;
      bt.inv=50;

      if(bt.hp<=0) {
        bt.hp=0;
        bt.dead=100;
        return;
      }
    }
  }

  bt.bul=bt.bul.filter(b =>
    b.k===2 ? b.age<70 :
    b.x>-60-(b.w||0)&&b.x<ZW+60&&
    b.y>-60-(b.h||0)&&b.y<ZH+60
  );
}

// ==========================================
// updaten
// ==========================================
function updateWorld() {
  for(const item of ITEMS) if(item.pop>0) item.pop--;

  if(dlg) {
    player.moving=false;
    player.frame=0;
    dlg.c=Math.min(
      dlg.lines[dlg.i].length,
      dlg.c+TYPSNELHEID
    );
    return;
  }

  const [dx,dy]=vec(
    (player.x+SPR_W/2)*SCALE,
    (player.y+SPR_H/2)*SCALE
  );

  player.moving=!!(dx||dy);

  const nx=clamp(player.x+dx*player.speed,0,BASE_W-SPR_W);
  if(!blocked(nx,player.y)) player.x=nx;

  const ny=clamp(player.y+dy*player.speed,0,BASE_H-SPR_H);
  if(!blocked(player.x,ny)) player.y=ny;

  if(dy>0) player.dir="down";
  if(dy<0) player.dir="up";
  if(dx<0) player.dir="left";
  if(dx>0) player.dir="right";

  if(player.moving) {
    if(++player.timer>=8) {
      player.frame++;
      player.timer=0;
    }
  } else {
    player.frame=0;
  }

  player.frame%=kris[player.dir].length;
}

function update() {
  fr++;

  if(mode==="world") updateWorld();
  else if(mode==="trans") {
    if(++tr>=50) startBattle();
  } else {
    updateBattle();
  }
}

// ==========================================
// Tekenen
// ==========================================
function text(s,x,y,size,col="#fff",align="left") {
  ctx.font=size+"px "+FONT;
  ctx.fillStyle=col;
  ctx.textAlign=align;
  ctx.textBaseline="top";
  ctx.fillText(s,x,y);
}

function drawKris() {
  const frames=kris[player.dir];
  const image=frames[player.frame%frames.length];
  const x=Math.floor(player.x*SCALE);
  const y=Math.floor(player.y*SCALE);

  if(image&&image.complete&&image.naturalWidth) {
    ctx.drawImage(image,x,y,SPR_W*SCALE,SPR_H*SCALE);
  } else {
    ctx.fillStyle="#ff0000";
    ctx.fillRect(x,y,SPR_W*SCALE,SPR_H*SCALE);
  }
}

function drawItem(item,near) {
  const w=IS*SCALE;
  const x=item.x*SCALE;
  const y=item.y*SCALE-
    Math.abs(Math.sin(item.pop/30*Math.PI))*14;

  if(item.img.complete&&item.img.naturalWidth) {
    ctx.drawImage(item.img,x,y,w,w);
  } else {
    ctx.fillStyle=item.col;
    ctx.fillRect(x,y,w,w);
    ctx.strokeStyle="#fff";
    ctx.lineWidth=3;
    ctx.strokeRect(x+1.5,y+1.5,w-3,w-3);
    text(item.id,x+w/2,y+w/2-8,16,"#000","center");
  }

  if(item===near) {
    ctx.strokeStyle="#ff0";
    ctx.lineWidth=3;
    ctx.strokeRect(x-4,y-4,w+8,w+8);

    const b=Math.sin(fr/8)*4;
    ctx.fillStyle="#ff0";
    ctx.beginPath();
    ctx.moveTo(x+w/2-9,y-24+b);
    ctx.lineTo(x+w/2+9,y-24+b);
    ctx.lineTo(x+w/2,y-10+b);
    ctx.fill();
  }
}

function drawDialog() {
  const bw=canvas.width-72;
  const bh=150;
  const bx=36;
  const by=dlg.top?24:canvas.height-bh-24;

  ctx.fillStyle="#000";
  ctx.fillRect(bx,by,bw,bh);
  ctx.strokeStyle="#fff";
  ctx.lineWidth=6;
  ctx.strokeRect(bx+3,by+3,bw-6,bh-6);

  const line=dlg.lines[dlg.i];
  text(line.slice(0,dlg.c|0),bx+32,by+36,34);

  if(dlg.c>=line.length&&(fr>>4)%2===0) {
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.moveTo(bx+bw-60,by+bh-52);
    ctx.lineTo(bx+bw-36,by+bh-52);
    ctx.lineTo(bx+bw-48,by+bh-34);
    ctx.fill();
  }
}

function drawWorld() {
  ctx.fillStyle="#111";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.imageSmoothingEnabled=false;

  const near=dlg?null:nearItem();
  const feet=player.y+SPR_H;

  for(const item of ITEMS)
    if(item.y+IS<=feet) drawItem(item,near);

  drawKris();

  for(const item of ITEMS)
    if(item.y+IS>feet) drawItem(item,near);

  if(dlg) drawDialog();
}

// ==========================================
// vijand en kogels
// ==========================================
function drawEnemy() {
  if(enemyImg.complete&&enemyImg.naturalWidth) {
    ctx.drawImage(enemyImg,canvas.width/2-48,24,96,96);
  } else {
    ctx.fillStyle="#8b0000";
    ctx.fillRect(canvas.width/2-42,28,84,72);
    ctx.fillStyle="#ff0000";
    ctx.fillRect(canvas.width/2-30,40,60,48);
    ctx.fillStyle="#fff";
    ctx.fillRect(canvas.width/2-22,50,12,12);
    ctx.fillRect(canvas.width/2+10,50,12,12);
    ctx.fillStyle="#000";
    ctx.fillRect(canvas.width/2-17,54,5,5);
    ctx.fillRect(canvas.width/2+15,54,5,5);
  }
}

function drawHeart(x,y,size) {
  if(heartImg.complete&&heartImg.naturalWidth) {
    ctx.drawImage(heartImg,x,y,size,size);
    return;
  }

  ctx.save();
  ctx.translate(x,y);
  ctx.scale(size/32,size/32);
  ctx.fillStyle="#ff0000";
  ctx.beginPath();
  ctx.moveTo(16,29);
  ctx.bezierCurveTo(12,25,1,17,1,9);
  ctx.bezierCurveTo(1,0,12,-2,16,7);
  ctx.bezierCurveTo(20,-2,31,0,31,9);
  ctx.bezierCurveTo(31,17,20,25,16,29);
  ctx.fill();
  ctx.restore();
}

function drawBullets() {
  for(const b of bt.bul) {
    if(b.k===0) {
      ctx.fillStyle="#fff";
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
      ctx.fill();
    } else if(b.k===1) {
      ctx.fillStyle="#fff";
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle="#cfcfcf";
      ctx.fillRect(b.x+4,b.y,b.w-8,b.h);
    } else if(b.age<40) {
      ctx.fillStyle=b.age%8<4
        ?"rgba(255,60,172,.9)"
        :"rgba(255,255,255,.7)";

      if(b.w>b.h) ctx.fillRect(b.x,b.y+b.h/2-2,b.w,4);
      else ctx.fillRect(b.x+b.w/2-2,b.y,4,b.h);
    } else {
      ctx.globalAlpha=Math.min(1,(62-b.age)/12);
      ctx.fillStyle="#ff3cac";
      ctx.fillRect(b.x,b.y,b.w,b.h);
      ctx.fillStyle="#fff";

      if(b.w>b.h) ctx.fillRect(b.x,b.y+10,b.w,b.h-20);
      else ctx.fillRect(b.x+10,b.y,b.w-20,b.h);

      ctx.globalAlpha=1;
    }
  }
}

function drawBattle() {
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawEnemy();

  text("aanval: "+PAT[bt.pat].n,18,140,18,"#fff");
  text("health "+bt.hp+"/20",18,170,18,"#ff4040");
  text("1-7: aanval  |  N: volgende",18,205,15,"#aaa");
  text("wasd pijltoetsen of muis",18,228,15,"#aaa");

  ctx.save();
  ctx.translate(ZX,ZY);

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,ZW,ZH);

  ctx.save();
  ctx.beginPath();
  ctx.rect(0,0,ZW,ZH);
  ctx.clip();

  drawBullets();

  if(bt.dead===0&&(bt.inv<=0||(bt.inv>>2)%2===0)) {
    drawHeart(bt.hx,bt.hy,HS);
  }

  ctx.restore();

  ctx.strokeStyle="#00ff00";
  ctx.lineWidth=2;
  ctx.strokeRect(-1,-1,ZW+2,ZH+2);

  ctx.restore();

  ctx.fillStyle="#600";
  ctx.fillRect(ZX+ZW-110,canvas.height-30,100,14);

  ctx.fillStyle="#ff0";
  ctx.fillRect(ZX+ZW-110,canvas.height-30,5*bt.hp,14);

  if(bt.dead>0) {
    ctx.fillStyle="rgba(0,0,0,.75)";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    text("DOOD",canvas.width/2,canvas.height/2-35,48,"#fff","center");
    text("Womp Womp",canvas.width/2,canvas.height/2+25,22,"#aaa","center");
  }
}

function drawTrans() {
  drawWorld();

  ctx.fillStyle="rgba(0,0,0,"+Math.min(1,tr/50)+")";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const sx=(player.x+SPR_W/2)*SCALE;
  const sy=(player.y+14)*SCALE;
  const ex=ZX+ZW/2;
  const ey=ZY+ZH*.65+HS/2;
  const p=Math.max(0,(tr-24)/26);

  if(tr>=24||(tr>>3)%2===0) {
    drawHeart(
      sx+(ex-sx)*p-HS/2,
      sy+(ey-sy)*p-HS/2,
      HS
    );
  }
}

function draw() {
  if(mode==="world") drawWorld();
  else if(mode==="trans") drawTrans();
  else drawBattle();
}

// ==========================================
// game loop
// ==========================================
function loop(now) {
  acc+=Math.min(100,now-last);
  last=now;

  while(acc>=1000/60) {
    update();
    acc-=1000/60;
  }

  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
